<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سنفور</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC93C;--t:#1FA6A0;--c:#FF7A59;--s:#2D3A4A;--bg:#FFF8EC}
*{box-sizing:border-box}
body{margin:0;font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--s)}
header{display:flex;align-items:center;gap:12px;padding:14px 20px}
header img{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--s)}
header h1{margin:0;font-size:32px}
header h1 span{color:var(--y)}
main{max-width:900px;margin:0 auto;padding:0 16px 40px}
.card{background:#fff;border-radius:24px;padding:24px;margin:16px 0;box-shadow:0 6px 20px rgba(45,58,74,.08)}
.hidden{display:none!important}
h2{margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
button{font-family:inherit;font-size:20px;font-weight:700;border:none;border-radius:999px;padding:12px 26px;cursor:pointer;background:var(--t);color:#fff}
button:disabled{opacity:.4;cursor:default}
button.alt{background:#fff;color:var(--t);border:2px solid var(--t)}
button.yellow{background:var(--y);color:var(--s)}
button.coral{background:var(--c)}
button.sel{background:var(--s);color:#fff;border-color:var(--s)}
button.small{font-size:16px;padding:6px 16px}
input,select,textarea{font-family:inherit;font-size:19px;padding:10px 14px;border-radius:14px;border:2px solid #ddd;background:#fff;color:var(--s)}
input{width:100%;max-width:340px}
input.full{max-width:none;margin:8px 0}
textarea{width:100%;font-size:22px;line-height:1.9;margin-top:6px}
label{display:block;font-weight:700;margin:14px 0 6px}
.qcard{border:2px solid #f0e6d2;border-radius:18px;padding:14px;margin:12px 0}
.optrow{flex-wrap:nowrap}
.optrow input[type=radio]{width:26px;max-width:26px;height:26px;flex:none;padding:0}
.plist button{display:block;width:100%;text-align:right;margin:8px 0;background:var(--bg);color:var(--s);border:2px solid var(--y)}
.passage{font-size:32px;line-height:2.3}
.w{padding:2px 4px;border-radius:8px;cursor:pointer}
.w.err{background:var(--c);color:#fff}
.w.last{outline:3px solid var(--t)}
.w.after{opacity:.35}
.timer{font-size:44px;font-weight:800;color:var(--c);min-width:90px;text-align:center}
.big{font-size:64px;font-weight:800;margin:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--bg);border-radius:18px;padding:16px;text-align:center}
.stat b{display:block;font-size:34px}
.opt{display:block;width:100%;margin:10px 0;text-align:right;background:var(--bg);color:var(--s);border:2px solid #e8dcc4;font-size:24px}
.opt.chosen{border-color:var(--t);background:#e3f5f4}
.tag{display:inline-block;font-size:15px;padding:3px 12px;border-radius:999px;background:var(--y);margin-bottom:8px}
.note{font-size:18px;color:#5b6675}
table{width:100%;border-collapse:collapse;font-size:18px}
td,th{padding:8px;border-bottom:1px solid #eee;text-align:right}
</style>
</head>
<body>
<header><img src="001_Sanfour_Arabic_Logo_qHa2qU9s.jpg" onerror="this.style.display='none'" alt=""><h1>سنفو<span>ر</span></h1></header>
<main>
<section id="home">
 <div class="card"><h2>الطالب</h2>
  <div class="row">
   <select id="sSel" onchange="curSid=this.value;localStorage.setItem('sanfour_cur',curSid)"></select>
   <button class="alt small" onclick="addStudent(false)">+ طالب جديد</button>
   <button class="alt small" onclick="openProfile(curSid)">📈 ملف الطالب</button>
  </div>
 </div>
 <div class="card">
  <h2>الصف</h2><div class="row" id="grades"></div>
  <h2 style="margin-top:18px">المستوى</h2><div class="row" id="levels"></div>
 </div>
 <div class="card"><h2>اختر نصًّا</h2><div class="plist" id="plist"></div></div>
 <div class="row">
  <button class="yellow" onclick="openDoctor()">✍️ إضافة نص (للدكتورة)</button>
  <button class="alt" onclick="showStudents()">👥 الطلاب</button>
  <button class="alt" onclick="showHistory()">سجل النتائج</button>
 </div>
</section>

<section id="students" class="hidden">
 <div class="card">
  <div class="row" style="justify-content:space-between"><h2>الطلاب</h2><button class="alt small" onclick="addStudent(true)">+ طالب جديد</button></div>
  <div id="stList"></div>
 </div>
 <div class="row"><button onclick="goHome()">رجوع</button></div>
</section>

<section id="profile" class="hidden">
 <div class="card">
  <div class="row" style="justify-content:space-between">
   <h2 id="prName" style="font-size:30px;margin:0"></h2>
   <div class="row"><button class="alt small" onclick="showStudents()">كل الطلاب</button><button class="alt small" onclick="deleteStudent()">حذف الطالب</button></div>
  </div>
 </div>
 <div id="prBody"></div>
 <div class="row"><button onclick="goHome()">الصفحة الرئيسية</button></div>
</section>

<section id="doctor" class="hidden">
 <div class="card">
  <h2>نص جديد</h2>
  <label>عنوان النص</label><input id="dTitle" class="full" placeholder="مثال: رحلة إلى البحر">
  <div class="row" style="margin-top:8px"><select id="dGrade"></select><select id="dLevel"></select></div>
  <label>نص القراءة</label>
  <textarea id="dText" rows="7" oninput="countWords()" placeholder="اكتبي النص هنا أو الصقيه…"></textarea>
  <p class="note" id="dCount"></p>
 </div>
 <div class="card">
  <div class="row" style="justify-content:space-between"><h2>أسئلة الفهم</h2><span class="tag" id="qCount"></span></div>
  <p class="note">من ٤ إلى ٦ أسئلة. حددي نوع المهارة والإجابة الصحيحة لكل سؤال.</p>
  <div id="qList"></div>
  <button class="alt" id="addQBtn" onclick="addQ()">+ أضف سؤالًا</button>
 </div>
 <p class="note" id="dErr" style="color:var(--c);font-weight:700"></p>
 <div class="row"><button onclick="savePassage()">حفظ ونشر</button><button class="alt" onclick="goHome()">إلغاء</button></div>
 <div class="card"><h2>نصوصي</h2><div id="myList"></div></div>
</section>

<section id="read" class="hidden">
 <div class="card">
  <div class="row" style="justify-content:space-between"><h2 id="ptitle"></h2><div class="timer" id="timer">٦٠</div></div>
  <p class="note" id="rnote"></p>
  <div class="passage" id="ptext"></div>
 </div>
 <div class="row">
  <button id="startBtn" onclick="startReading()">ابدأ القراءة 🎤</button>
  <button id="stopBtn" class="coral hidden" onclick="stopReading()">انتهى</button>
 </div>
 <div class="row hidden" id="sbtns">
  <button id="modeBtn" class="alt" onclick="toggleMode()">تحديد آخر كلمة قُرئت</button>
  <button class="yellow" onclick="calcResult()">احسب النتيجة</button>
 </div>
</section>
<section id="result" class="hidden">
 <div class="card" style="text-align:center"><h2>قراءة رائعة! 🌟</h2><p class="big" id="wcpm"></p><p>كلمة صحيحة في الدقيقة</p></div>
 <div class="card"><div class="stats" id="rstats"></div><audio id="audio" controls class="hidden" style="width:100%;margin-top:14px"></audio></div>
 <div class="row"><button onclick="startQuestions()">إلى أسئلة الفهم</button></div>
</section>
<section id="quiz" class="hidden">
 <div class="card"><p class="note" id="qnum"></p><span class="tag" id="qskill"></span><h2 id="qtext" style="font-size:28px"></h2><div id="qopts"></div></div>
 <div class="row"><button id="nextQ" onclick="nextQuestion()" disabled>التالي</button></div>
</section>
<section id="summary" class="hidden">
 <div class="card"><h2>تقرير الجلسة (للدكتورة)</h2><div class="stats" id="sstats"></div></div>
 <div class="card"><h2>الفهم حسب المهارة</h2><div id="skills"></div></div>
 <div class="card"><h2>التوصية</h2><p id="reco" style="font-size:22px"></p><p class="note">النتائج مؤشر للمتابعة فقط، وليست تشخيصًا.</p></div>
 <div class="row"><button onclick="openProfile(curSid)">📈 ملف الطالب</button><button class="alt" onclick="goHome()">جلسة جديدة</button></div>
</section>
<section id="history" class="hidden">
 <div class="card"><h2>سجل النتائج</h2><div id="htable"></div></div>
 <div class="row"><button onclick="goHome()">رجوع</button><button class="alt" onclick="clearHistory()">مسح السجل</button></div>
</section>
</main>
<script>
const PASSAGES=[
{id:'g1l2',grade:1,level:2,title:'قِطَّتِي لُولُو',
text:"عِنْدِي قِطَّةٌ صَغِيرَةٌ اسْمُهَا لُولُو. لَوْنُ لُولُو أَبْيَضُ. تُحِبُّ لُولُو الْحَلِيبَ. تَلْعَبُ لُولُو بِالْكُرَةِ فِي الْبَيْتِ. فِي اللَّيْلِ تَنَامُ لُولُو قُرْبَ سَرِيرِي.",
questions:[
{q:'ما لَوْنُ لُولُو؟',skill:'حرفي',options:['أسود','أبيض','بُنّي'],answer:1},
{q:'ماذا تُحِبُّ لُولُو؟',skill:'حرفي',options:['الحليب','الماء','العصير'],answer:0},
{q:'أين تنام لُولُو في الليل؟',skill:'حرفي',options:['في الحديقة','في المطبخ','قرب السرير'],answer:2},
{q:'النص يتحدث عن قطة صغيرة وما تحبه.',skill:'الفكرة الرئيسة',options:['صح','خطأ'],answer:0}]},
{id:'g2l2',grade:2,level:2,title:'الطَّائِرَةُ الضَّائِعَةُ',
text:"رَكَضَتْ مَرْيَمُ إِلَى الْحَدِيقَةِ وَمَعَهَا طَائِرَةٌ حَمْرَاءُ. كَانَتِ الرِّيحُ قَوِيَّةً، فَطَارَتِ الطَّائِرَةُ عَالِيَةً فِي السَّمَاءِ. فَجْأَةً انْقَطَعَ الْخَيْطُ، وَطَارَتِ الطَّائِرَةُ بَعِيدًا. حَزِنَتْ مَرْيَمُ كَثِيرًا. بَحَثَتْ عَنْهَا مَعَ أَخِيهَا سَامِي، فَوَجَدَاهَا فَوْقَ شَجَرَةٍ كَبِيرَةٍ. صَعِدَ الْحَارِسُ عَلَى سُلَّمٍ وَأَنْزَلَهَا. شَكَرَتْهُ مَرْيَمُ وَقَالَتْ: سَأَرْبِطُ الْخَيْطَ جَيِّدًا فِي الْمَرَّةِ الْقَادِمَةِ.",
questions:[
{q:'لماذا طارت الطائرة عالية؟',skill:'حرفي',options:['لأن مريم رمتها','لأن الريح كانت قوية','لأن الطائرة جديدة'],answer:1},
{q:'أين وُجِدت الطائرة؟',skill:'حرفي',options:['فوق شجرة كبيرة','في النهر','في البيت'],answer:0},
{q:'ما معنى كلمة «انقطع» في النص؟',skill:'مفردات',options:['طال كثيرًا','تلوّن','انفصل وتمزّق'],answer:2},
{q:'ماذا تعلّمت مريم من القصة؟',skill:'استنتاجي',options:['ألا تلعب في الحديقة','أن تربط الخيط جيدًا','أن تشتري طائرة جديدة'],answer:1},
{q:'ما الفكرة الرئيسة للقصة؟',skill:'الفكرة الرئيسة',options:['طائرة ضاعت ثم وُجدت بمساعدة الآخرين','الريح خطيرة دائمًا','الحارس يحب الأشجار'],answer:0}]},
{id:'g5l1',grade:5,level:1,title:'النَّحلةُ الصَّغيرةُ والعَسَل',
text:"تعيشُ النحلاتُ في بيتٍ اسمُه الخَلِيَّة. في الخليةِ ملكةٌ واحدةٌ، وعددٌ كبيرٌ من النحلاتِ العامِلات. تضعُ الملكةُ البَيضَ، وتعملُ العاملاتُ طَوالَ اليوم. في الصباحِ، تطيرُ النحلةُ إلى الحديقة. تقفُ على زهرةٍ، وتمتصُّ منها سائلًا حُلوًا اسمُه الرَّحِيق. تحفظُ النحلةُ الرحيقَ في مَعِدةٍ خاصّة، ثم تعودُ إلى الخلية. هناك تُعطي الرحيقَ لنحلاتٍ أخرى. تضعُ النحلاتُ الرحيقَ في بيوتٍ صغيرةٍ من الشَّمع، لها ستةُ جوانب. ثم تُحرِّكُ النحلاتُ أجنحتَها بسرعةٍ لتجفيفِ الماءِ من الرحيق. وبعدَ أيامٍ، يصبحُ الرحيقُ عسلًا كثيفًا. تُغلِقُ النحلاتُ البيوتَ بغطاءٍ من الشمع، ليبقى العسلُ طعامًا لها في الشتاء. وحين تنتقلُ النحلةُ من زهرةٍ إلى زهرة، تحملُ معها حُبوبَ اللِّقاح. وهذا يساعدُ الأزهارَ على صُنعِ البُذورِ والثِّمار. قالت مريمُ لأخيها سامي: «النحلةُ صغيرة، لكنَّ عملَها كبير!» فابتسمَ سامي وقال: «سأشكرُها كلَّما أكلتُ العسل.»",
questions:[
{q:'ما اسم السائل الحلو الذي تمتصه النحلة من الزهرة؟',skill:'حرفي',options:['الشمع','الرحيق','اللقاح'],answer:1},
{q:'ماذا تفعل النحلة بعد أن تمتص الرحيق؟',skill:'ترتيب الأحداث',options:['تعود إلى الخلية','تنام على الزهرة','تصنع الشمع فورًا'],answer:0},
{q:'ما معنى كلمة «الخليّة» في النص؟',skill:'مفردات',options:['زهرة كبيرة','طعام النحل','بيت النحل'],answer:2},
{q:'لماذا تُغلق النحلات البيوت بغطاء من الشمع؟',skill:'استنتاجي',options:['لتنام فيها','ليبقى العسل طعامًا لها في الشتاء','لتمنع الضوء'],answer:1},
{q:'النص يتحدث عن عمل النحلات في صنع العسل ومساعدة الأزهار.',skill:'الفكرة الرئيسة',options:['صح','خطأ'],answer:0}]},
{id:'g6l3',grade:6,level:3,title:'رحلة الغوص على اللؤلؤ',
text:"في الماضي، قبل اكتشاف النفط، كان البحر مصدر رزق لكثير من أهل الخليج العربي. وفي كل صيف، كانت السفن الخشبية تنطلق نحو مغاصات اللؤلؤ، وتبقى في عرض البحر قرابة أربعة أشهر، في موسم يُعرف باسم «الغَوص الكبير». على ظهر السفينة يعمل فريق متعاون، يقوده النُّوخذة، أي ربان السفينة. أما الغواص فكان يضع على أنفه ملقطا صغيرا يسمى الفِطام ليمنع دخول الماء، ثم يربط في قدمه حجرا ثقيلا يساعده على النزول بسرعة إلى القاع. وكان يحمل سلة من الحبال تسمى الدَّيين، يجمع فيها المحار بيديه وهو يحبس أنفاسه نحو دقيقة أو أكثر. وفوق السطح يقف السَّيب ممسكا بالحبل، فإذا شده الغواص سحبه بقوة حتى يصعد ليتنفس. كان الغواص يكرر النزول عشرات المرات في اليوم، من شروق الشمس حتى غروبها. وفي صباح اليوم التالي يجلس البحارة معا لفلق المحار، وتتعلق عيونهم بكل صدفة، لعل في داخلها لؤلؤة بيضاء لامعة. وكانت أجمل اللآلئ تباع في الأسواق البعيدة بأثمان غالية. وكان الأهل ينتظرون عودة السفن على الشاطئ بالأغاني والفرح، في يوم يسمونه «القَفّال». اليوم، يتذكر أهل الخليج هذه المهنة الشاقة بفخر، فهي تحكي قصة الصبر والشجاعة والتعاون.",
questions:[
{q:'لماذا كان الغواص يربط حجرا ثقيلا في قدمه؟',skill:'حرفي',options:['ليحمل فيه المحار','لينزل بسرعة إلى القاع','ليمنع دخول الماء إلى أنفه'],answer:1},
{q:'لماذا كانت حياة الغواص تعتمد على السيب؟',skill:'استنتاجي',options:['لأنه يسحبه إلى السطح ليتنفس','لأنه يقود السفينة','لأنه يبيع اللؤلؤ'],answer:0},
{q:'ما معنى كلمة «النُّوخذة» في النص؟',skill:'مفردات',options:['سلة لجمع المحار','يوم عودة السفن','ربان السفينة'],answer:2},
{q:'ما الفكرة الرئيسة للنص؟',skill:'الفكرة الرئيسة',options:['اللؤلؤ يباع في الأسواق البعيدة','الغوص على اللؤلؤ مهنة شاقة قامت على الصبر والشجاعة والتعاون','السفن الخشبية كانت كبيرة وجميلة'],answer:1}]}
];
const TARGETS={1:[20,30,40],2:[40,50,60],3:[55,65,75],4:[65,75,85],5:[75,85,95],6:[80,90,100]};
const GN=['','الأول','الثاني','الثالث','الرابع','الخامس','السادس'];
const LN=['','دعم','ضمن الصف','تحدٍّ'];
const SKILLS=['حرفي','استنتاجي','مفردات','ترتيب الأحداث','الفكرة الرئيسة','نقدي'];
const ar=n=>String(n).replace(/\d/g,d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const stat=(l,v)=>`<div class="stat"><b>${v}</b>${l}</div>`;
const getCustom=()=>JSON.parse(localStorage.getItem('sanfour_custom')||'[]');
const allPassages=()=>PASSAGES.concat(getCustom());
const getStudents=()=>JSON.parse(localStorage.getItem('sanfour_students')||'[]');
const saveStudents=s=>localStorage.setItem('sanfour_students',JSON.stringify(s));
const getHist=()=>JSON.parse(localStorage.getItem('sanfour_h')||'[]');
const saveHist=h=>localStorage.setItem('sanfour_h',JSON.stringify(h));
const studentName=id=>(getStudents().find(x=>x.id==id)||{}).name||'—';
let grade=2,level=2,P=null,words=[],errs=new Set(),lastIdx=0,mode='err',phase='idle',t0=0,elapsed=0,tick=null,rec=null,chunks=[],audioURL=null,qi=0,answers=[],R={},dq=[];
let curSid=localStorage.getItem('sanfour_cur')||'',profSid='';

function show(id){['home','students','profile','doctor','read','result','quiz','summary','history'].forEach(s=>$(s).classList.toggle('hidden',s!==id));window.scrollTo(0,0)}

/* ---------- Students ---------- */
function migrate(){
 const s=getStudents(),h=getHist();let ch=false;
 h.forEach(r=>{if(!r.sid){let st=s.find(x=>x.name==r.name);if(!st){st={id:'s'+Date.now()+Math.random().toString(36).slice(2,6),name:r.name||'—'};s.push(st);}r.sid=st.id;ch=true;}});
 if(ch){saveStudents(s);saveHist(h);}
}
function renderStudentSel(){
 const s=getStudents();
 if(!s.find(x=>x.id==curSid))curSid=s.length?s[0].id:'';
 $('sSel').innerHTML=s.length?s.map(x=>`<option value="${x.id}" ${x.id==curSid?'selected':''}>${esc(x.name)}</option>`).join(''):'<option value="">— أضف طالبًا أولًا —</option>';
}
function addStudent(fromList){
 const n=(prompt('اسم الطالب:')||'').trim();if(!n)return;
 const s=getStudents(),st={id:'s'+Date.now(),name:n};s.push(st);saveStudents(s);

function chart(vals,max,color,target){
 const W=600,H=240,p=36,n=vals.length;
 const X=i=>n==1?W/2:W-p-i*(W-2*p)/(n-1);
 const Y=v=>H-p-(v/max)*(H-2*p);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">`;
 s+=`<line x1="${p}" y1="${H-p}" x2="${W-p}" y2="${H-p}" stroke="#ddd" stroke-width="2"/>`;
 if(target!=null)s+=`<line x1="${p}" y1="${Y(target)}" x2="${W-p}" y2="${Y(target)}" stroke="#2D3A4A" stroke-opacity=".45" stroke-width="2" stroke-dasharray="8 6"/>`;
 if(n>1)s+=`<polyline fill="none" stroke="${color}" stroke-width="4" stroke-linejoin="round" points="${vals.map((v,i)=>X(i)+','+Y(v)).join(' ')}"/>`;
 vals.forEach((v,i)=>{s+=`<circle cx="${X(i)}" cy="${Y(v)}" r="7" fill="${color}"/><text x="${X(i)}" y="${Y(v)-14}" text-anchor="middle" font-size="18" font-family="Tajawal" fill="#2D3A4A">${ar(v)}</text><text x="${X(i)}" y="${H-10}" text-anchor="middle" font-size="15" fill="#5b6675">${ar(i+1)}</text>`;});
 return s+'</svg>';
}
function recommend(ss){
 const last=ss[ss.length-1];
 if(!last.grade)return 'أكمل جلسات جديدة للحصول على توصية.';
 const same=ss.filter(r=>r.grade==last.grade&&r.level==last.level).slice(-3);
 if(same.length<3)return `يلزم ${ar(3-same.length)} جلسة إضافية في هذا المستوى قبل التوصية بتغيير المستوى.`;
 const t=TARGETS[last.grade][last.level-1];
 if(same.every(r=>r.wcpm>=t&&r.acc>=95&&r.comp>=80))return last.level<3?'⬆️ يُقترح الصعود إلى المستوى '+ar(last.level+1)+'.':'⬆️ متمكن من المستوى الثالث؛ يمكن التفكير في الصف التالي.';
 if(same.every(r=>r.acc<90||r.wcpm<=t-15))return last.level>1?'⬇️ يُقترح الانتقال مؤقتًا إلى المستوى '+ar(last.level-1)+' للدعم.':'يحتاج دعمًا إضافيًّا في المستوى الأول.';
 return '➡️ البقاء في المستوى الحالي ومواصلة التدريب.';
}
function openProfile(sid){
 if(!sid){alert('اختر طالبًا أولًا');return;}
 const st=getStudents().find(x=>x.id==sid);if(!st)return;
 profSid=sid;$('prName').textContent='👤 '+st.name;
 const ss=getHist().filter(r=>r.sid==sid).reverse();
 if(!ss.length){$('prBody').innerHTML='<div class="card"><p class="note">لا توجد جلسات لهذا الطالب بعد.</p></div>';show('profile');return;}
 const lg=[...ss].reverse().find(r=>r.grade), target=lg?TARGETS[lg.grade][lg.level-1]:null;
 const avg=a=>Math.round(a.reduce((x,y)=>x+y,0)/a.length);
 const wc=ss.map(r=>r.wcpm), cp=ss.map(r=>r.comp), last=ss[ss.length-1];
 let html=`<div class="card">${lg?`<p class="note">المستوى الحالي: الصف ${GN[lg.grade]} · المستوى ${ar(lg.level)} (${LN[lg.level]})</p>`:''}<div class="stats">${stat('عدد الجلسات',ar(ss.length))+stat('آخر سرعة',ar(last.wcpm))+stat('أفضل سرعة',ar(Math.max(...wc)))+stat('متوسط الدقة',ar(avg(ss.map(r=>r.acc)))+'٪')+stat('متوسط الفهم',ar(avg(cp))+'٪')}</div></div>`;
 html+=`<div class="card"><h2>تطور سرعة القراءة (كلمة في الدقيقة)</h2>${chart(wc,Math.max(...wc,target||0,10)*1.2,'#1FA6A0',target)}<p class="note">${target!=null?`الخط المتقطع = الهدف المبدئي (${ar(target)}). `:''}الجلسات من اليمين (الأقدم) إلى اليسار (الأحدث).</p></div>`;
 html+=`<div class="card"><h2>تطور الفهم (٪)</h2>${chart(cp,110,'#FF7A59',80)}<p class="note">الخط المتقطع = ٨٠٪ (فهم جيد).</p></div>`;
 const sk={};ss.forEach(r=>Object.entries(r.skills||{}).forEach(([k,v])=>{sk[k]=sk[k]||[0,0];sk[k][0]+=v[0];sk[k][1]+=v[1];}));
 if(Object.keys(sk).length)html+=`<div class="card"><h2>الفهم حسب المهارة (كل الجلسات)</h2><table><tr><th>المهارة</th><th>الصحيح</th><th>النسبة</th></tr>${Object.entries(sk).map(([k,v])=>`<tr><td>${k}</td><td>${ar(v[0])} من ${ar(v[1])}</td><td>${ar(Math.round(v[0]/v[1]*100))}٪</td></tr>`).join('')}</table></div>`;
 html+=`<div class="card"><h2>التوصية</h2><p style="font-size:22px">${recommend(ss)}</p><p class="note">مؤشر للمتابعة فقط، وليس تشخيصًا. القرار النهائي للدكتورة.</p></div>`;
 html+=`<div class="card"><h2>كل الجلسات</h2><table><tr><th>#</th><th>التاريخ</th><th>النص</th><th>كلمة/دقيقة</th><th>الدقة</th><th>الفهم</th></tr>${ss.map((r,i)=>`<tr><td>${ar(i+1)}</td><td>${r.date}</td><td>${esc(r.title)}</td><td>${ar(r.wcpm)}</td><td>${ar(r.acc)}٪</td><td>${ar(r.comp)}٪</td></tr>`).reverse().join('')}</table></div>`;
 $('prBody').innerHTML=html;show('profile');
}

function savePassage(){
 const title=$('dTitle').value.trim(), text=$('dText').value.trim();

 if(!title)err='اكتبي عنوان النص.';
 else if(!text||text.split(/\s+/).length<10)err='النص قصير جدًّا (١٠ كلمات على الأقل).';

 else for(let i=0;i<dq.length;i++){
  if(!dq[i].q.trim()){err=`اكتبي نص السؤال ${ar(i+1)}.`;break;}

 }

/* ---------- Reading session ---------- */
function openPassage(id){
 if(!curSid){alert('أضف طالبًا أولًا من زر «+ طالب جديد».');return;}
 P=allPassages().find(p=>p.id==id);
 words=P.text.trim().split(/\s+/);errs=new Set();lastIdx=words.length-1;mode='err';phase='idle';elapsed=0;audioURL=null;
 $('ptitle').textContent=P.title;$('timer').textContent=ar(60);
 $('rnote').textContent='الطالب: '+studentName(curSid)+' — اضغط «ابدأ القراءة» واطلب منه أن يقرأ بصوت مرتفع.';
 $('startBtn').classList.remove('hidden');$('stopBtn').classList.add('hidden');$('sbtns').classList.add('hidden');$('modeBtn').classList.remove('sel');
 renderWords();show('read');
}
function renderWords(){
 $('ptext').innerHTML=words.map((w,i)=>`<span class="w ${errs.has(i)?'err':''} ${phase=='score'&&i==lastIdx?'last':''} ${phase=='score'&&i>lastIdx?'after':''}" onclick="tapWord(${i})">${esc(w)}</span>`).join(' ');
}
function tapWord(i){
 if(phase!='score')return;
 if(mode=='last'){lastIdx=i;mode='err';$('modeBtn').classList.remove('sel');}
 else{errs.has(i)?errs.delete(i):errs.add(i);}
 renderWords();
}
function toggleMode(){mode=mode=='last'?'err':'last';$('modeBtn').classList.toggle('sel',mode=='last');}
async function startReading(){
 phase='reading';chunks=[];rec=null;
 try{
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  rec=new MediaRecorder(stream);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=()=>{audioURL=URL.createObjectURL(new Blob(chunks,{type:rec.mimeType}));stream.getTracks().forEach(t=>t.stop());};
  rec.start();
 }catch(e){rec=null;}
 t0=Date.now();
 $('startBtn').classList.add('hidden');$('stopBtn').classList.remove('hidden');
 $('rnote').textContent=rec?'🔴 جارٍ التسجيل… اضغط «انتهى» إذا أنهى الطالب النص قبل الوقت.':'التسجيل الصوتي غير متاح، لكن المؤقت يعمل.';
 tick=setInterval(()=>{const s=60-Math.floor((Date.now()-t0)/1000);$('timer').textContent=ar(Math.max(s,0));if(s<=0)stopReading(true);},250);
}
function stopReading(timeUp){
 if(phase!='reading')return;
 clearInterval(tick);
 elapsed=timeUp===true?60:Math.max(1,(Date.now()-t0)/1000);
 if(rec&&rec.state!='inactive')rec.stop();
 phase='score';
 $('stopBtn').classList.add('hidden');$('sbtns').classList.remove('hidden');
 $('rnote').textContent=timeUp===true?'انتهى الوقت! اضغط على كل كلمة أخطأ فيها الطالب، ثم اضغط «تحديد آخر كلمة قُرئت» واختر آخر كلمة وصل إليها.':'اضغط على كل كلمة أخطأ فيها الطالب (تصبح برتقالية)، ثم اضغط «احسب النتيجة».';
 renderWords();
}
function calcResult(){
 const attempted=lastIdx+1, e=[...errs].filter(i=>i<=lastIdx).length, correct=attempted-e;
 R={wcpm:Math.round(correct/elapsed*60),acc:Math.round(correct/attempted*100),correct,errors:e,secs:Math.round(elapsed)};
 const target=TARGETS[P.grade][P.level-1];
 $('wcpm').textContent=ar(R.wcpm);
 $('rstats').innerHTML=stat('الدقة',ar(R.acc)+'٪')+stat('كلمات صحيحة',ar(correct))+stat('أخطاء',ar(e))+stat('الزمن',ar(R.secs)+' ث')+stat('الهدف المبدئي',ar(target));
 if(audioURL){$('audio').src=audioURL;$('audio').classList.remove('hidden')}else{$('audio').classList.add('hidden')}
 show('result');
}
function startQuestions(){qi=0;answers=[];renderQ();show('quiz');}
function renderQ(){
 const q=P.questions[qi];
 $('qnum').textContent=`السؤال ${ar(qi+1)} من ${ar(P.questions.length)}`;
 $('qskill').textContent=q.skill;$('qtext').textContent=q.q;
 $('qopts').innerHTML=q.options.map((o,i)=>`<button class="opt" onclick="pick(${i},this)">${esc(o)}</button>`).join('');
 $('nextQ').disabled=true;$('nextQ').textContent=qi==P.questions.length-1?'إنهاء':'التالي';
}
function pick(i,el){answers[qi]=i;document.querySelectorAll('.opt').forEach(b=>b.classList.remove('chosen'));el.classList.add('chosen');$('nextQ').disabled=false;}
function nextQuestion(){qi++;if(qi<P.questions.length)renderQ();else showSummary();}
function showSummary(){
 const qs=P.questions, right=qs.filter((q,i)=>answers[i]===q.answer).length, comp=Math.round(right/qs.length*100);
 const target=TARGETS[P.grade][P.level-1], sk={};
 qs.forEach((q,i)=>{sk[q.skill]=sk[q.skill]||[0,0];sk[q.skill][1]++;if(answers[i]===q.answer)sk[q.skill][0]++;});
 $('sstats').innerHTML=stat('كلمة في الدقيقة',ar(R.wcpm))+stat('الهدف المبدئي',ar(target))+stat('الدقة',ar(R.acc)+'٪')+stat('الفهم',ar(comp)+'٪');
 $('skills').innerHTML='<table><tr><th>المهارة</th><th>النتيجة</th></tr>'+Object.entries(sk).map(([k,v])=>`<tr><td>${k}</td><td>${ar(v[0])} من ${ar(v[1])}</td></tr>`).join('')+'</table>';
 const fluent=R.wcpm>=target&&R.acc>=95, understands=comp>=80;
 let reco;
 if(fluent&&understands)reco='قارئ متمكن في هذا المستوى ✅ إذا تكرر ذلك في ٣ جلسات متتالية يُقترح الصعود إلى المستوى التالي.';
 else if(fluent)reco='يقرأ بطلاقة جيدة، لكنه يحتاج دعمًا في الفهم والمفردات.';
 else if(understands)reco='يفهم النص جيدًا رغم بطء القراءة؛ التركيز على الطلاقة وتعرّف الكلمات.';
 else reco='يحتاج دعمًا في الطلاقة والفهم معًا. إذا تكرر ذلك في ٣ جلسات يُقترح مستوى أسهل.';
 if(R.acc<90)reco+=' (الدقة أقل من ٩٠٪)';
 $('reco').textContent=reco;
 const h=getHist();
 h.unshift({sid:curSid,name:studentName(curSid),ts:Date.now(),date:new Date().toLocaleDateString('ar'),title:P.title,grade:P.grade,level:P.level,wcpm:R.wcpm,acc:R.acc,comp,skills:sk});
 saveHist(h);
 show('summary');
}

let pinNext=null,pinMode='enter',pinFirst='';
const PIN_MIN=10;
function unlocked(){return Date.now()<+(sessionStorage.getItem('sanfour_unlock')||0)}
function setUnlocked(){sessionStorage.setItem('sanfour_unlock',Date.now()+PIN_MIN*60000);$('lockBtn').classList.remove('hidden')}

function needPin(fn){
 if(unlocked()){setUnlocked();fn();return;}
 pinNext=fn;$('pinIn').value='';$('pinErr').textContent='';
 if(!localStorage.getItem('sanfour_pin')){pinMode='new1';$('pinTitle').textContent='🔐 إنشاء رمز الدكتورة';$('pinNote').textContent='اختاري رمزًا من ٤ إلى ٦ أرقام لحماية صفحات الدكتورة.';}

 $('pinBox').classList.remove('hidden');setTimeout(()=>$('pinIn').focus(),50);
}
function pinOK(){

function parentData(sid){
 const st=getStudents().find(x=>x.id==sid)||{name:'—'}, now=Date.now(), wk=7*864e5;
 const all=getHist().filter(r=>r.sid==sid).reverse();
 const week=all.filter(r=>r.ts&&now-r.ts<=wk), use=week.length?week:all.slice(-5);
 return {n:st.name.split(' ')[0],f:new Date(now-wk).toLocaleDateString('ar'),t:new Date(now).toLocaleDateString('ar'),s:use.length,w:use.map(r=>r.wcpm),c:use.map(r=>r.comp),wk:week.length>0};
}

function addUser(){

}

 if(!/^\d{4,6}$/.test(p)){alert('الرمز من ٤ إلى ٦ أرقام.');return;}

function delUser(i){

}

{id:'b1-2',grade:1,level:2,title:"أَحْمَدُ فِي الْمَدْرَسَةِ",text:"ذَهَبَ أَحْمَدُ إِلَى الْمَدْرَسَةِ مَعَ أَبِيهِ. فِي الصَّفِّ مُعَلِّمَةٌ لَطِيفَةٌ. قَالَتِ الْمُعَلِّمَةُ: صَبَاحُ الْخَيْرِ يَا أَطْفَالُ. قَرَأَ أَحْمَدُ قِصَّةً قَصِيرَةً. رَسَمَ شَجَرَةً خَضْرَاءَ وَشَمْسًا صَفْرَاءَ. فِي الِاسْتِرَاحَةِ أَكَلَ تُفَّاحَةً حَمْرَاءَ. لَعِبَ مَعَ صَدِيقِهِ عُمَرَ. عَادَ أَحْمَدُ إِلَى الْبَيْتِ سَعِيدًا.",questions:[{q:"مَعَ مَنْ ذَهَبَ أَحْمَدُ إِلَى الْمَدْرَسَةِ؟",skill:"حرفي",options:["مَعَ أُمِّهِ","مَعَ أَبِيهِ","مَعَ جَدِّهِ"],answer:1},{q:"مَاذَا رَسَمَ أَحْمَدُ؟",skill:"حرفي",options:["شَجَرَةً وَشَمْسًا","بَيْتًا وَقِطَّةً","بَحْرًا وَسَفِينَةً"],answer:0},{q:"مَا مَعْنَى كَلِمَةِ «لَطِيفَةٌ» فِي النَّصِّ؟",skill:"مفردات",options:["غَاضِبَةٌ","طَوِيلَةٌ","رَقِيقَةٌ طَيِّبَةٌ"],answer:2}]},
{id:'b1-3',grade:1,level:3,title:"مَرْيَمُ فِي السُّوقِ",text:"ذَهَبَتْ مَرْيَمُ مَعَ أُمِّهَا إِلَى السُّوقِ. فِي السُّوقِ أَصْوَاتٌ كَثِيرَةٌ وَأَلْوَانٌ جَمِيلَةٌ. رَأَتْ مَرْيَمُ الْبُرْتُقَالَ وَالْمَوْزَ وَالْعِنَبَ. اشْتَرَتِ الْأُمُّ خُبْزًا سَاخِنًا وَجُبْنًا أَبْيَضَ. رَأَتْ مَرْيَمُ رَجُلًا كَبِيرًا يَحْمِلُ كِيسًا ثَقِيلًا. قَالَتْ: هَلْ أُسَاعِدُكَ يَا عَمُّ؟ ابْتَسَمَ الرَّجُلُ وَقَالَ: شُكْرًا يَا ابْنَتِي. شَعَرَتْ مَرْيَمُ بِالْفَرَحِ، وَعَادَتْ مَعَ أُمِّهَا إِلَى الْبَيْتِ.",questions:[{q:"مَاذَا اشْتَرَتِ الْأُمُّ مِنَ السُّوقِ؟",skill:"حرفي",options:["لَحْمًا وَأَرُزًّا","خُبْزًا وَجُبْنًا","حَلْوَى وَعَصِيرًا"],answer:1},{q:"كَيْفَ سَاعَدَتْ مَرْيَمُ الرَّجُلَ؟",skill:"حرفي",options:["عَرَضَتْ أَنْ تُسَاعِدَهُ","أَعْطَتْهُ نُقُودًا","ضَحِكَتْ عَلَيْهِ"],answer:0},{q:"بِمَاذَا شَعَرَتْ مَرْيَمُ بَعْدَ أَنْ سَاعَدَتِ الرَّجُلَ؟",skill:"استنتاجي",options:["بِالْحُزْنِ","بِالْخَوْفِ","بِالْفَرَحِ"],answer:2}]},
{id:'b2-1',grade:2,level:1,title:"سُلَحْفَاةُ يُوسُفَ",text:"عِنْدَ يُوسُفَ سُلَحْفَاةٌ صَغِيرَةٌ اسْمُهَا زُمُرُّدَةُ. ظَهْرُهَا قَوِيٌّ وَلَوْنُهُ أَخْضَرُ. تَمْشِي زُمُرُّدَةُ بِبُطْءٍ فِي الْحَدِيقَةِ. تُحِبُّ أَكْلَ الْخَسِّ وَالْخِيَارِ. فِي الصَّبَاحِ يَضَعُ يُوسُفُ لَهَا الطَّعَامَ وَالْمَاءَ. كُلَّ يَوْمٍ يُرَاقِبُهَا يُوسُفُ وَهِيَ تَأْكُلُ، وَيَتَعَلَّمُ مِنْهَا الصَّبْرَ. وَفِي يَوْمٍ مِنَ الْأَيَّامِ اخْتَفَتْ زُمُرُّدَةُ. بَحَثَ يُوسُفُ تَحْتَ الشَّجَرَةِ وَخَلْفَ الْبَابِ. ثُمَّ وَجَدَهَا نَائِمَةً بَيْنَ الْأَزْهَارِ. ضَحِكَ يُوسُفُ وَقَالَ: أَنْتِ بَطِيئَةٌ، لَكِنَّكِ تُحْسِنِينَ الِاخْتِبَاءَ! حَمَلَهَا بِلُطْفٍ وَأَعَادَهَا إِلَى مَكَانِهَا. وَمُنْذُ ذَلِكَ الْيَوْمِ صَنَعَ لَهَا بَيْتًا صَغِيرًا مِنَ الْخَشَبِ.",questions:[{q:"أَيْنَ وَجَدَ يُوسُفُ زُمُرُّدَةَ؟",skill:"حرفي",options:["تَحْتَ الشَّجَرَةِ","نَائِمَةً بَيْنَ الْأَزْهَارِ","خَلْفَ الْبَابِ"],answer:1},{q:"مَاذَا صَنَعَ يُوسُفُ لِسُلَحْفَاتِهِ فِي النِّهَايَةِ؟",skill:"حرفي",options:["بَيْتًا مِنَ الْخَشَبِ","حَوْضًا مِنَ الْمَاءِ","صُنْدُوقًا مِنَ الْوَرَقِ"],answer:0},{q:"مَا مَعْنَى كَلِمَةِ «بِبُطْءٍ» فِي النَّصِّ؟",skill:"مفردات",options:["بِسُرْعَةٍ","بِغَيْرِ عَجَلَةٍ","بِقُوَّةٍ"],answer:1}]},
{id:'b2-2',grade:2,level:2,title:"يَوْمٌ عَلَى الشَّاطِئِ",text:"فِي يَوْمِ الْجُمُعَةِ ذَهَبَتْ عَائِلَةُ لَيْلَى إِلَى شَاطِئِ الْبَحْرِ. كَانَتِ الشَّمْسُ دَافِئَةً وَالْمَاءُ أَزْرَقَ صَافِيًا. بَنَتْ لَيْلَى وَأَخُوهَا خَالِدٌ قَلْعَةً كَبِيرَةً مِنَ الرَّمْلِ. زَيَّنَا الْقَلْعَةَ بِالْأَصْدَافِ الْمُلَوَّنَةِ، وَصَنَعَا لَهَا بَابًا وَنَوَافِذَ صَغِيرَةً، وَوَضَعَا عَلَى قِمَّتِهَا رِيشَةَ طَائِرٍ بَيْضَاءَ. ثُمَّ جَاءَتْ مَوْجَةٌ قَوِيَّةٌ فَهَدَمَتْ جُزْءًا مِنْهَا. حَزِنَ خَالِدٌ وَكَادَ يَبْكِي. قَالَتْ لَيْلَى: لَا تَحْزَنْ، سَنَبْنِيهَا مَعًا مِنْ جَدِيدٍ، وَنَجْعَلُهَا أَبْعَدَ عَنِ الْمَاءِ. عَمِلَ الْأَخَوَانِ بِنَشَاطٍ حَتَّى صَارَتِ الْقَلْعَةُ أَجْمَلَ مِنْ قَبْلُ. الْتَقَطَ الْأَبُ لَهُمَا صُورَةً بِجَانِبِهَا. وَعِنْدَ الْغُرُوبِ جَلَسَتِ الْعَائِلَةُ تَأْكُلُ الْبِطِّيخَ الْبَارِدَ وَتُشَاهِدُ السُّفُنَ الْبَعِيدَةَ. قَالَ خَالِدٌ: هَذَا أَجْمَلُ يَوْمٍ فِي الصَّيْفِ!",questions:[{q:"مَاذَا حَدَثَ لِلْقَلْعَةِ عِنْدَمَا جَاءَتِ الْمَوْجَةُ؟",skill:"حرفي",options:["هَدَمَتْ جُزْءًا مِنْهَا","زَادَتْهَا جَمَالًا","لَمْ يَحْدُثْ لَهَا شَيْءٌ"],answer:0},{q:"لِمَاذَا قَرَّرَتْ لَيْلَى أَنْ تَبْنِيَ الْقَلْعَةَ أَبْعَدَ عَنِ الْمَاءِ؟",skill:"استنتاجي",options:["لِتَكُونَ قَرِيبَةً مِنَ السُّفُنِ","لِأَنَّ الرَّمْلَ هُنَاكَ أَبْيَضُ","حَتَّى لَا تَهْدِمَهَا الْأَمْوَاجُ"],answer:2},{q:"مَاذَا فَعَلَتِ الْعَائِلَةُ عِنْدَ الْغُرُوبِ؟",skill:"ترتيب الأحداث",options:["سَبَحَتْ فِي الْبَحْرِ","أَكَلَتِ الْبِطِّيخَ وَشَاهَدَتِ السُّفُنَ","عَادَتْ إِلَى الْبَيْتِ"],answer:1}]},
{id:'b2-3',grade:2,level:3,title:"الْهَدَفُ الْأَجْمَلُ",text:"فِي حَيِّ سَلِيمٍ مَلْعَبٌ صَغِيرٌ يَلْعَبُ فِيهِ الْأَطْفَالُ كُرَةَ الْقَدَمِ كُلَّ مَسَاءٍ. كَانَ سَلِيمٌ أَسْرَعَ لَاعِبٍ فِي الْفَرِيقِ، وَكَانَ يُحِبُّ أَنْ يُسَجِّلَ الْأَهْدَافَ وَحْدَهُ. فِي أَحَدِ الْأَيَّامِ جَاءَ وَلَدٌ جَدِيدٌ اسْمُهُ آدَمُ. كَانَ آدَمُ خَجُولًا وَيَقِفُ بَعِيدًا يَنْظُرُ إِلَى اللَّعِبِ. لَمْ يَطْلُبْ مِنْهُ أَحَدٌ أَنْ يَلْعَبَ. تَذَكَّرَ سَلِيمٌ أَوَّلَ يَوْمٍ لَهُ فِي الْحَيِّ، وَكَيْفَ شَعَرَ بِالْوَحْدَةِ. فَرَكَضَ نَحْوَ آدَمَ وَقَالَ: تَعَالَ، الْعَبْ مَعَنَا! فِي الْمُبَارَاةِ مَرَّرَ سَلِيمٌ الْكُرَةَ إِلَى آدَمَ، فَسَدَّدَهَا آدَمُ بِقُوَّةٍ وَسَجَّلَ هَدَفًا رَائِعًا. صَفَّقَ الْجَمِيعُ وَهَتَفُوا بِاسْمِهِ. وَمُنْذُ ذَلِكَ الْيَوْمِ صَارَ آدَمُ يَأْتِي إِلَى الْمَلْعَبِ كُلَّ مَسَاءٍ، وَصَارَ صَدِيقًا لِكُلِّ أَطْفَالِ الْحَيِّ. عَرَفَ سَلِيمٌ يَوْمَهَا أَنَّ فَرْحَةَ صَدِيقِهِ أَجْمَلُ مِنْ أَيِّ هَدَفٍ يُسَجِّلُهُ وَحْدَهُ.",questions:[{q:"لِمَاذَا رَكَضَ سَلِيمٌ نَحْوَ آدَمَ؟",skill:"استنتاجي",options:["لِأَنَّهُ تَذَكَّرَ شُعُورَهُ بِالْوَحْدَةِ","لِيَأْخُذَ مِنْهُ الْكُرَةَ","لِأَنَّ آدَمَ نَادَاهُ"],answer:0},{q:"مَا الدَّرْسُ الَّذِي تَعَلَّمَهُ سَلِيمٌ؟",skill:"استنتاجي",options:["أَنَّ السُّرْعَةَ أَهَمُّ شَيْءٍ","أَنْ يَلْعَبَ وَحْدَهُ دَائِمًا","أَنَّ فَرْحَةَ الصَّدِيقِ أَجْمَلُ مِنْ أَيِّ هَدَفٍ"],answer:2},{q:"مَا مَعْنَى كَلِمَةِ «خَجُولًا» فِي النَّصِّ؟",skill:"مفردات",options:["كَثِيرَ الْكَلَامِ","يَسْتَحِي مِنَ النَّاسِ","سَرِيعَ الْغَضَبِ"],answer:1}]},
{id:'b3-1',grade:3,level:1,title:"النَّحْلَةُ النَّشِيطَةُ",text:"خَرَجَتْ نَحْلَةٌ صَغِيرَةٌ مِنْ خَلِيَّتِهَا فِي الصَّبَاحِ الْبَاكِرِ. طَارَتْ فَوْقَ الْحُقُولِ الْخَضْرَاءِ تَبْحَثُ عَنِ الْأَزْهَارِ. وَقَفَتْ عَلَى زَهْرَةٍ حَمْرَاءَ وَجَمَعَتْ مِنْهَا الرَّحِيقَ. ثُمَّ طَارَتْ إِلَى زَهْرَةٍ صَفْرَاءَ، ثُمَّ إِلَى زَهْرَةٍ بَيْضَاءَ. كَانَتْ تَعْمَلُ بِجِدٍّ وَلَا تَتْعَبُ. وَفِي الطَّرِيقِ رَأَتْ فَرَاشَةً مُلَوَّنَةً، فَقَالَتْ لَهَا: صَبَاحُ الْخَيْرِ يَا صَدِيقَتِي، الْأَزْهَارُ كَثِيرَةٌ الْيَوْمَ! فِي الْمَسَاءِ عَادَتْ إِلَى الْخَلِيَّةِ وَأَعْطَتِ الرَّحِيقَ لِأَخَوَاتِهَا. صَنَعَتِ النَّحَلَاتُ مِنْهُ عَسَلًا ذَهَبِيًّا لَذِيذًا. يُحِبُّ النَّاسُ الْعَسَلَ لِأَنَّهُ طَعَامٌ مُفِيدٌ وَحُلْوٌ. وَالنَّحْلُ يُعَلِّمُنَا أَنَّ الْعَمَلَ مَعًا يَصْنَعُ أَشْيَاءَ عَظِيمَةً.",questions:[{q:"مَاذَا جَمَعَتِ النَّحْلَةُ مِنَ الْأَزْهَارِ؟",skill:"حرفي",options:["الْمَاءَ","الرَّحِيقَ","الْأَوْرَاقَ"],answer:1},{q:"مَاذَا صَنَعَتِ النَّحَلَاتُ مِنَ الرَّحِيقِ؟",skill:"حرفي",options:["شَمْعًا أَبْيَضَ","خُبْزًا","عَسَلًا ذَهَبِيًّا"],answer:2},{q:"مَا الدَّرْسُ الَّذِي يُعَلِّمُنَا إِيَّاهُ النَّحْلُ؟",skill:"استنتاجي",options:["الْعَمَلُ مَعًا يَصْنَعُ أَشْيَاءَ عَظِيمَةً","النَّوْمُ طَوَالَ الْيَوْمِ","الطَّيَرَانُ وَحْدَنَا"],answer:0}]},
{id:'b3-2',grade:3,level:2,title:"لَيْلَةٌ فِي الصَّحْرَاءِ",text:"فِي الْعُطْلَةِ سَافَرَ فَيْصَلٌ مَعَ جَدِّهِ إِلَى الصَّحْرَاءِ. رَكِبَا السَّيَّارَةَ سَاعَتَيْنِ حَتَّى وَصَلَا إِلَى خَيْمَةٍ كَبِيرَةٍ بَيْنَ الْكُثْبَانِ الرَّمْلِيَّةِ. رَأَى فَيْصَلٌ جَمَلًا يَمْشِي بِهُدُوءٍ، فَسَأَلَ جَدَّهُ: كَيْفَ يَعِيشُ الْجَمَلُ بِلَا مَاءٍ؟ قَالَ الْجَدُّ: الْجَمَلُ يَشْرَبُ كَثِيرًا مَرَّةً وَاحِدَةً، وَيَصْبِرُ عَلَى الْعَطَشِ أَيَّامًا طَوِيلَةً، وَلِذَلِكَ نُسَمِّيهِ سَفِينَةَ الصَّحْرَاءِ. فِي اللَّيْلِ جَلَسَا قُرْبَ النَّارِ يَشْرَبَانِ الْحَلِيبَ الدَّافِئَ وَيَأْكُلَانِ التَّمْرَ. وَحَكَى الْجَدُّ قِصَصًا عَنْ أَيَّامِ طُفُولَتِهِ فِي الْبَادِيَةِ. نَظَرَ فَيْصَلٌ إِلَى السَّمَاءِ فَرَأَى نُجُومًا كَثِيرَةً لَامِعَةً لَمْ يَرَهَا فِي الْمَدِينَةِ. أَشَارَ الْجَدُّ إِلَى نَجْمٍ سَاطِعٍ وَقَالَ: كَانَ أَجْدَادُنَا يَعْرِفُونَ الطَّرِيقَ بِالنُّجُومِ. نَامَ فَيْصَلٌ تِلْكَ اللَّيْلَةَ وَهُوَ يَحْلُمُ بِرِحْلَةٍ جَدِيدَةٍ.",questions:[{q:"لِمَاذَا يُسَمَّى الْجَمَلُ سَفِينَةَ الصَّحْرَاءِ؟",skill:"استنتاجي",options:["لِأَنَّهُ يَسْبَحُ فِي الْبَحْرِ","لِأَنَّهُ يَصْبِرُ عَلَى الْعَطَشِ وَيَحْمِلُ النَّاسَ فِي الصَّحْرَاءِ","لِأَنَّهُ كَبِيرٌ مِثْلَ السَّفِينَةِ"],answer:1},{q:"كَيْفَ كَانَ الْأَجْدَادُ يَعْرِفُونَ الطَّرِيقَ؟",skill:"حرفي",options:["بِالنُّجُومِ","بِالْخَرَائِطِ","بِالْهَاتِفِ"],answer:0},{q:"مَا مَعْنَى كَلِمَةِ «الْكُثْبَانِ» فِي النَّصِّ؟",skill:"مفردات",options:["الْأَشْجَارِ الْعَالِيَةِ","الْبُيُوتِ الْقَدِيمَةِ","تِلَالِ الرَّمْلِ"],answer:2}]},
{id:'b3-3',grade:3,level:3,title:"الْقَمَرُ الَّذِي يَتَغَيَّرُ",text:"سَأَلَتْ هِنْدُ أُمَّهَا ذَاتَ مَسَاءٍ: لِمَاذَا يَتَغَيَّرُ شَكْلُ الْقَمَرِ؟ أَمْسِ كَانَ مِثْلَ الْهِلَالِ، وَالْيَوْمَ صَارَ أَكْبَرَ! ابْتَسَمَتِ الْأُمُّ وَأَحْضَرَتْ مِصْبَاحًا وَكُرَةً بَيْضَاءَ. قَالَتْ: لِنَتَخَيَّلْ أَنَّ الْمِصْبَاحَ هُوَ الشَّمْسُ، وَالْكُرَةَ هِيَ الْقَمَرُ، وَرَأْسَكِ هُوَ الْأَرْضُ. أَطْفَأَتِ الْأُمُّ الْأَنْوَارَ وَأَضَاءَتِ الْمِصْبَاحَ، ثُمَّ حَرَّكَتِ الْكُرَةَ حَوْلَ رَأْسِ هِنْدٍ بِبُطْءٍ. لَاحَظَتْ هِنْدُ أَنَّ الْجُزْءَ الْمُضِيءَ مِنَ الْكُرَةِ يَكْبُرُ ثُمَّ يَصْغُرُ. قَالَتِ الْأُمُّ: الْقَمَرُ لَا يُضِيءُ بِنَفْسِهِ، بَلْ يَعْكِسُ ضَوْءَ الشَّمْسِ. وَحِينَ يَدُورُ حَوْلَ الْأَرْضِ نَرَى مِنْهُ أَجْزَاءً مُخْتَلِفَةً مُضَاءَةً. فَمَرَّةً نَرَاهُ هِلَالًا رَفِيعًا، وَمَرَّةً نِصْفَ دَائِرَةٍ، وَمَرَّةً بَدْرًا كَامِلًا مُسْتَدِيرًا. وَهَذِهِ الْأَشْكَالُ تُسَمَّى أَطْوَارَ الْقَمَرِ. فَرِحَتْ هِنْدُ وَقَرَّرَتْ أَنْ تَرْسُمَ شَكْلَ الْقَمَرِ كُلَّ لَيْلَةٍ فِي دَفْتَرٍ صَغِيرٍ لِمُدَّةِ شَهْرٍ كَامِلٍ. وَقَالَتْ: سَأَكُونُ عَالِمَةَ فَلَكٍ صَغِيرَةً!",questions:[{q:"مِنْ أَيْنَ يَأْتِي ضَوْءُ الْقَمَرِ؟",skill:"حرفي",options:["مِنْ نَفْسِهِ","مِنَ النُّجُومِ","مِنَ الشَّمْسِ"],answer:2},{q:"مَاذَا قَرَّرَتْ هِنْدُ أَنْ تَفْعَلَ كُلَّ لَيْلَةٍ؟",skill:"حرفي",options:["أَنْ تَرْسُمَ شَكْلَ الْقَمَرِ","أَنْ تَنَامَ مُبَكِّرًا","أَنْ تُطْفِئَ الْمِصْبَاحَ"],answer:0},{q:"مَا مَعْنَى «أَطْوَارِ الْقَمَرِ» فِي النَّصِّ؟",skill:"مفردات",options:["أَسْمَاءُ النُّجُومِ","أَشْكَالُ الْقَمَرِ الْمُخْتَلِفَةُ","أَلْوَانُ السَّمَاءِ"],answer:1}]},
{id:'b4-1',grade:4,level:1,title:"شجرة الجدّة",text:"زرعت الجدة فاطمة شجرة ليمون صغيرة أمام البيت قبل سنوات طويلة. كان حفيدها كريم يساعدها في سَقيها كل يوم بعد عودته من المدرسة. كبِرت الشجرة مع كريم، وصار ظلها واسعًا تجلس تحته العائلة في أيام الصيف الحارة. في الربيع تمتلئ أغصانها بأزهار بيضاء صغيرة لها رائحة جميلة، ثم تتحول الأزهار إلى ثمار خضراء، وبعد أسابيع تصبح صفراء لامعة. كانت الجدة تقطف الليمون وتصنع منه عصيرًا باردًا للجيران، ويوزعه كريم عليهم وهو يبتسم. وفي أحد الأيام هبّت عاصفة قوية فكسرت غصنًا كبيرًا من الشجرة. حزِن كريم كثيرًا، لكن الجدة قالت له: لا تقلق يا بُنيّ، الشجرة القوية تُنبت أغصانًا جديدة. اعتنى كريم بالشجرة أكثر من قبل، وبعد شهور ظهرت أوراق خضراء صغيرة مكان الغصن المكسور. فهِم كريم أن الصبر والعناية يصنعان المعجزات.",questions:[{q:"ماذا كانت الجدة تصنع من الليمون؟",skill:"حرفي",options:["مربى","عصيرا باردا","كعكا"],answer:1},{q:"ماذا حدث للشجرة بعد أن اعتنى بها كريم؟",skill:"حرفي",options:["ظهرت أوراق خضراء جديدة","يبست تماما","سقطت كلها"],answer:0},{q:"ما الفكرة الرئيسة للنص؟",skill:"الفكرة الرئيسة",options:["العاصفة تكسر الأشجار","الليمون طعمه حامض","الصبر والعناية يصنعان المعجزات"],answer:2}]},
{id:'b4-2',grade:4,level:2,title:"مع أبي في البحر",text:"يستيقظ سالم قبل شروق الشمس في كل يوم سبت ليرافق والده الصيّاد إلى الميناء. تنتظرهما هناك قوارب خشبية ملوّنة تتمايل فوق الماء. يحمل الوالد الشِّباك، ويحمل سالم صندوق الطعام وقارورة الماء. يُبحر القارب بعيدًا عن الشاطئ، فيرى سالم الدلافين تقفز بين الأمواج، وطيور النورس تحلّق فوق رأسه. يضحك سالم ويلوّح لها بيده كأنها أصدقاؤه القدامى. يرمي الوالد الشبكة في البحر، وينتظران بصبر ساعة كاملة. ثم يسحبانها معًا، فتخرج مليئة بأسماك فضية لامعة. يختار الوالد الأسماك الكبيرة، ويعيد الصغيرة إلى البحر. يسأله سالم: لماذا تعيدها يا أبي؟ فيجيب: لكي تكبَر وتتكاثر، فيبقى البحر غنيًّا بالخير لنا ولأبنائنا من بعدنا. عند الظهر يعودان إلى سوق السمك المزدحم، حيث ينادي الباعة بأصوات عالية، ويتجمع الناس حول الصناديق ليختاروا أفضل الأسماك. يبيع الوالد صيده، ويشتري سالم كعكة ساخنة بالسمسم. في طريق العودة يشعر سالم بالتعب، لكنه سعيد لأنه تعلّم درسًا مهمًّا عن البحر.",questions:[{q:"لماذا يعيد الوالد الأسماك الصغيرة إلى البحر؟",skill:"استنتاجي",options:["لأنها لا تُباع","لكي تكبر وتتكاثر ويبقى البحر غنيا","لأنها مريضة"],answer:1},{q:"ماذا رأى سالم وهو في القارب؟",skill:"حرفي",options:["الدلافين وطيور النورس","الحيتان والقروش","السلاحف والبط"],answer:0},{q:"ما معنى كلمة «تتمايل» في النص؟",skill:"مفردات",options:["تغرق","تتوقف","تتحرك يمينا ويسارا"],answer:2}]},
{id:'b4-3',grade:4,level:3,title:"مكتبة الحيّ الصغيرة",text:"لاحظت نور أن كثيرًا من أطفال حيّها لا يملكون كتبًا في بيوتهم. كانت هي تحب القراءة كثيرًا، وعندها رفّ مليء بالقصص التي قرأتها مرات عديدة. فكّرت نور طويلًا، ثم خطرت لها فكرة رائعة: لماذا لا نصنع مكتبة صغيرة يشترك فيها الجميع؟ أخبرت والدها بالفكرة، فأعجبته وساعدها في صنع صندوق خشبي كبير له باب زجاجي. دهنت نور الصندوق باللون الأزرق، وكتبت عليه بخط جميل: خُذْ كتابًا، واترُكْ كتابًا. وضع الوالد الصندوق قرب باب الحديقة العامة، ووضعت نور فيه عشر قصص من كتبها. في اليوم التالي وجدت أن ثلاث قصص قد اختفت، وأن مكانها كتابين جديدين وورقة صغيرة كُتب عليها: شكرًا لكِ! مع مرور الأسابيع صار الصندوق مكانًا يلتقي فيه أطفال الحي. يتبادلون الكتب، ويجلسون على المقاعد يقرؤون معًا، ويحكي بعضهم لبعض عن القصص التي أحبّوها. حتى الكبار بدؤوا يضعون كتبًا للطبخ والتاريخ والعلوم. شعرت نور بفخر كبير، وأدركت أن فكرة صغيرة نابعة من قلب طيّب يمكن أن تغيّر حيًّا كاملًا.",questions:[{q:"ماذا كُتب على صندوق المكتبة؟",skill:"حرفي",options:["ممنوع اللمس","خذ كتابا، واترك كتابا","مكتبة نور"],answer:1},{q:"ماذا أدركت نور في نهاية القصة؟",skill:"استنتاجي",options:["أن الكتب غالية الثمن","أن الكبار لا يقرؤون","أن فكرة صغيرة من قلب طيب تغير حيا كاملا"],answer:2},{q:"لماذا فكرت نور في صنع المكتبة؟",skill:"استنتاجي",options:["لأن كثيرا من الأطفال لا يملكون كتبا","لأنها أرادت بيع كتبها","لأن والدها طلب ذلك"],answer:0}]},
{id:'b5-1',grade:5,level:1,title:"ريم تهزم خوفها",text:"كانت ريم تخاف من الماء منذ كانت صغيرة. وحين سجّلتها أمها في نادي السباحة، وقفت على حافة المسبح ترتجف ولا تريد أن تنزل. اقتربت منها المدرّبة سلمى وقالت بهدوء: لن نسبح اليوم، سنجلس فقط ونضع أقدامنا في الماء. في الدرس الثاني نزلت ريم إلى الجزء القليل العُمق وهي تمسك الحافة بقوة. وفي الدرس الثالث تعلّمت كيف تطفو على ظهرها وتتنفس ببطء. شعرت ريم أن الماء يحملها مثل سرير ناعم، فابتسمت لأول مرة. كانت المدرّبة تشجعها دائمًا وتقول: كل خطوة صغيرة هي نجاح كبير. مرّت الأسابيع، وصارت ريم تسبح من طرف المسبح إلى طرفه الآخر دون خوف. وفي نهاية العام أقام النادي سباقًا للمبتدئين، فاشتركت فيه ريم. لم تفُز بالمركز الأول، بل وصلت رابعة، لكنها خرجت من الماء وهي تضحك وترفع يديها. ركضت إليها أمها وعانقتها، فقالت ريم: اليوم هزمتُ خوفي، وهذا أهمّ من أي ميدالية.",questions:[{q:"كيف ساعدت المدرّبة سلمى ريم في الدرس الأول؟",skill:"حرفي",options:["دفعتها إلى الماء","جعلتها تضع قدميها في الماء فقط","طلبت منها العودة إلى البيت"],answer:1},{q:"لماذا كانت ريم سعيدة مع أنها لم تفز بالمركز الأول؟",skill:"استنتاجي",options:["لأنها هزمت خوفها","لأنها حصلت على ميدالية","لأن السباق انتهى"],answer:0},{q:"ماذا تعلّمت ريم في الدرس الثالث؟",skill:"ترتيب الأحداث",options:["الاشتراك في السباق","الجلوس على الحافة","الطفو على ظهرها والتنفس ببطء"],answer:2}]},
{id:'b5-2',grade:5,level:2,title:"رحلة خيالية إلى المريخ",text:"في حصة العلوم عرضت المعلمة على الطلاب صورًا للمرّيخ، الكوكب الأحمر. سأل زياد: لماذا لونه أحمر؟ أجابت المعلمة: لأن تربته تحتوي على الكثير من الحديد الصدِئ، مثل المسمار القديم الذي تركناه في المطر. ثم قسّمت الطلاب إلى مجموعات، وطلبت من كل مجموعة أن تخطط لرحلة خيالية إلى المريخ. فكّرت مجموعة زياد في الأشياء التي يحتاجها روّاد الفضاء. كتبت لانا: نحتاج إلى الأكسجين، لأن هواء المريخ لا يصلح للتنفس. وأضاف زياد: ونحتاج إلى ملابس دافئة جدًّا، فالمريخ أبرد من أبرد صحراء على الأرض. وقال حمزة: يجب أن نأخذ بذورًا لنزرع طعامنا داخل بيت زجاجي. عرفوا أيضًا أن الرحلة قد تستغرق نحو سبعة أشهر، فقرروا أن يأخذوا كتبًا وألعابًا حتى لا يشعروا بالملل، وأن يرسلوا رسائل مصوّرة إلى عائلاتهم كل أسبوع. في نهاية الحصة رسمت المجموعة صاروخًا كبيرًا وكتبت عليه أسماء أعضائها. قالت المعلمة: ربما يكون أحدكم يومًا من أوائل البشر الذين يمشون على المريخ. نظر زياد من النافذة إلى السماء، وبدأ يحلم بذلك اليوم.",questions:[{q:"لماذا لون المريخ أحمر؟",skill:"حرفي",options:["لأن الشمس قريبة منه","لأن تربته فيها حديد صدئ","لأنه حار جدا"],answer:1},{q:"ما الشيئان اللذان قررت المجموعة أن تأخذهما في الرحلة؟",skill:"حرفي",options:["الأكسجين وملابس دافئة","المظلات والرمال","الأسماك والقوارب"],answer:0},{q:"كم قد تستغرق الرحلة إلى المريخ؟",skill:"حرفي",options:["سبعة أيام","سبع سنوات","نحو سبعة أشهر"],answer:2}]},
{id:'b5-3',grade:5,level:3,title:"دكّان الجدّ في السوق القديم",text:"كل يوم خميس يزور عمر جدّه أبا محمود في دكّانه الصغير داخل السوق القديم. الدكّان مليء بأكياس التوابل الملوّنة: الكمّون البنّي، والكُركُم الأصفر، والفلفل الأحمر، والقرفة التي تملأ رائحتها المكان. يقف الجد خلف ميزانه النحاسي القديم، ويستقبل الزبائن بابتسامة لا تفارق وجهه. في ذلك اليوم دخلت امرأة مسنّة تمشي بصعوبة، وطلبت قليلًا من الزعتر والسُّمّاق. وزن الجد ما طلبته، ثم وضع في الكيس حفنة إضافية دون أن يقول شيئًا. وحين أخرجت المرأة نقودها، اكتشفت أنها لا تكفي. احمرّ وجهها خجلًا، لكن الجد قال لها بلطف: ادفعي ما تستطيعين يا خالة، والباقي هدية مني. خرجت المرأة وهي تدعو له بالخير. سأل عمر جدّه متعجّبًا: ألن تخسر بهذه الطريقة يا جدّي؟ ضحك الجد وأجاب: يا بُنيّ، التاجر الذكي لا يحسب الربح بالنقود فقط. هذه المرأة ستتذكر هذا الدكّان طوال عمرها، وستخبر جاراتها عنه، والناس يعودون دائمًا إلى المكان الذي يُعامَلون فيه باحترام. ثم أعطاه ملعقة صغيرة وطلب منه أن يملأ أكياس الزبائن. شعر عمر بالفخر، وقرر أن يكون تاجرًا أمينًا وكريمًا مثل جدّه حين يكبَر.",questions:[{q:"ماذا فعل الجد عندما لم تكفِ نقود المرأة؟",skill:"حرفي",options:["طردها من الدكان","أخذ منها الزعتر","قبل ما تستطيع والباقي هدية"],answer:2},{q:"ما معنى قول الجد: «التاجر الذكي لا يحسب الربح بالنقود فقط»؟",skill:"استنتاجي",options:["أن معاملة الناس باحترام تجلب ربحا أكبر","أن النقود لا قيمة لها","أن التاجر يجب أن يخسر"],answer:0},{q:"ما معنى كلمة «حفنة» في النص؟",skill:"مفردات",options:["كيس كبير","ملء الكف","ميزان صغير"],answer:1}]},
{id:'b6-1',grade:6,level:1,title:"الروبوت الذي يسقي النباتات",text:"في معرض العلوم المدرسي قررت سلمى وصديقتها جنى أن تصنعا روبوتًا صغيرًا يسقي النباتات. جمعتا عُلبًا فارغة وأسلاكًا ومحرّكًا صغيرًا ولوحة إلكترونية بسيطة. عملتا أسبوعين كاملين بعد انتهاء الدروس، تقرآن الكتب وتشاهدان الدروس التعليمية وتسألان معلّم الحاسوب. فشلت المحاولة الأولى، فقد تحرّك الروبوت إلى الخلف بدل الأمام. وفي المحاولة الثانية سكب الماء كله على الطاولة. شعرت جنى بالإحباط وقالت: ربما لن ننجح أبدًا. لكن سلمى أجابت: كل خطأ يعلّمنا شيئًا جديدًا، لنبحث عن السبب. فحصتا الأسلاك واحدًا واحدًا، فوجدتا سلكين في غير مكانهما. كما اكتشفتا أن الأنبوب كان أطول مما يجب، فقصّتاه بالمقص. أصلحتا الخطأ، وأضافتا جهاز استشعار صغيرًا يقيس رطوبة التربة، حتى لا يسقي النبتة إلا عندما تحتاج إلى الماء. وفي يوم المعرض تحرّك الروبوت ببطء نحو أصيص جافّ، وسكب فيه كمية مناسبة من الماء، ثم توقف. صفّق الحاضرون بحماس، وحصلت الصديقتان على جائزة أفضل فكرة. قالت جنى ضاحكة: الآن فهمتُ أن الفشل جزء من النجاح.",questions:[{q:"ما المشكلتان اللتان حدثتا في المحاولتين الأولى والثانية؟",skill:"حرفي",options:["تحرك للخلف ثم سكب الماء كله","انكسر ثم احترق","توقف ثم ضاع"],answer:0},{q:"لماذا أضافت الصديقتان جهاز استشعار للرطوبة؟",skill:"استنتاجي",options:["ليتحرك بسرعة أكبر","لكي لا يسقي النبتة إلا عند حاجتها","ليصبح شكله أجمل"],answer:1},{q:"ما الفكرة الرئيسة للنص؟",skill:"الفكرة الرئيسة",options:["الروبوتات خطيرة","النباتات لا تحتاج إلى الماء","الفشل جزء من النجاح"],answer:2}]},
{id:'b6-2',grade:6,level:2,title:"الماء أغلى من الذهب",text:"تقع قرية حسن في واحة خضراء وسط صحراء واسعة. تحيط بالقرية آلاف من أشجار النخيل، وتجري بين البساتين قنوات صغيرة تحمل الماء من عين قديمة. كان جدّ حسن يقول دائمًا: الماء في الصحراء أغلى من الذهب. لم يفهم حسن هذه العبارة جيدًا، حتى جاء صيف شديد الحرارة قلّ فيه ماء العين. بدأت بعض أشجار النخيل تذبُل، وظهر القلق على وجوه المزارعين. اجتمع أهل القرية في المجلس ليبحثوا عن حلّ. اقترح بعضهم حفر بئر جديدة، لكن الحفر يحتاج إلى وقت ومال كثير. عندها رفع حسن يده وقال: تعلّمنا في المدرسة أن الري بالتنقيط يوفّر كثيرًا من الماء، لأنه يوصل الماء إلى جذور الشجرة مباشرة بدل أن يضيع في القنوات. نظر الكبار بعضهم إلى بعض، ثم طلبوا منه أن يشرح الفكرة. في الأسابيع التالية عمل الجميع معًا، الكبار والصغار، يمدّون الأنابيب الرفيعة بين النخيل. وحين انتهوا لاحظوا أن الماء القليل صار يكفي البساتين كلها. وفي الخريف حملت النخيل تمرًا وفيرًا حلو المذاق. ربّت الجد على كتف حسن وقال: الآن فهمتَ لماذا الماء أغلى من الذهب، وفهمتُ أنا أن العلم كنز آخر.",questions:[{q:"ما المشكلة التي واجهت أهل القرية في الصيف؟",skill:"حرفي",options:["كثرة الأمطار","قلة ماء العين وذبول النخيل","هجوم الجراد"],answer:1},{q:"كيف يوفّر الري بالتنقيط الماء؟",skill:"حرفي",options:["يوصل الماء إلى الجذور مباشرة","يزيد ماء العين","يحفر بئرا جديدة"],answer:0},{q:"ما معنى كلمة «تذبل» في النص؟",skill:"مفردات",options:["تكبر وتثمر","تتحرك","تضعف وتجف"],answer:2}]},
{id:'b6-3',grade:6,level:3,title:"رسالة في زجاجة",text:"بينما كانت دانة تتمشّى مع أخيها الأكبر طارق على شاطئ البحر، لمحت زجاجة خضراء تلمع بين الصخور. التقطتها بحذر، فوجدت في داخلها ورقة ملفوفة بخيط أزرق. فتحتها بصعوبة، وقرأت بصوت مرتفع: أنا تلميذة اسمي لينا، أعيش في جزيرة بعيدة. رميتُ هذه الزجاجة في البحر لأعرف إلى أين تأخذها التيارات. إذا وجدتها، فأرجو أن تكتب لي. كانت الرسالة مكتوبة بالعربية والإنجليزية، وفي أسفلها عنوان بريد إلكتروني لمدرستها. دهشت دانة وسألت: كيف وصلت الزجاجة إلى هنا؟ شرح لها طارق أن مياه المحيطات لا تبقى ساكنة، بل تتحرك في تيارات عظيمة تشبه أنهارًا داخل البحر، وقد تحمل الأشياء آلاف الكيلومترات. ثم أضاف بجدّية: وهذا يعني أيضًا أن النفايات التي نرميها في البحر قد تسافر بعيدًا وتؤذي الأسماك والسلاحف في أماكن لم نرَها قطّ. في المساء كتبت دانة رسالة إلى لينا، وأخبرتها عن مدينتها وعن الشاطئ الذي وجدت عليه الزجاجة. وبعد أيام وصلها ردّ طويل مع صور للجزيرة وشواطئها البيضاء. اتفقت الصديقتان على مشروع مشترك: أن تنظّم كلٌّ منهما مع زملائها حملة لتنظيف شاطئ مدينتها في اليوم نفسه. وفي صباح يوم السبت حملت دانة كيسًا كبيرًا وقفّازين، وهي تفكّر في صديقتها البعيدة التي تفعل الشيء نفسه على الجانب الآخر من البحر.",questions:[{q:"كيف وصلت الزجاجة من الجزيرة البعيدة إلى الشاطئ؟",skill:"حرفي",options:["رماها طارق من القارب","حملتها التيارات البحرية","أحضرها طائر"],answer:1},{q:"ما المشروع المشترك الذي اتفقت عليه دانة ولينا، ولماذا هو مهم؟",skill:"نقدي",options:["رحلة إلى الجزيرة؛ للتسلية","مسابقة رسم؛ للفوز بجائزة","حملة تنظيف الشاطئ؛ لحماية البحر وكائناته"],answer:2},{q:"لماذا يجب ألا نرمي النفايات في البحر؟",skill:"استنتاجي",options:["لأنها قد تسافر بعيدا وتؤذي الأسماك والسلاحف","لأنها تغير لون الماء فقط","لأنها تمنع السباحة"],answer:0}]}
);
 /* ---------- Backup & restore ---------- */
$('admin').insertAdjacentHTML('afterbegin',`<div class="card"><h2>💾 النسخ الاحتياطي</h2><p class="note">احفظي كل البيانات (المستخدمون، الطلاب، النتائج، النصوص) في ملف، واستعيديها على جهاز أو رابط آخر.</p><div class="row"><button onclick="exportData()">⬇️ تنزيل نسخة احتياطية</button><button class="alt" onclick="$('impFile').click()">⬆️ استعادة من ملف</button><input type="file" id="impFile" accept=".json,application/json" class="hidden" onchange="importData(this.files[0])"></div></div>`);
function exportData(){
 const d={app:'sanfour',v:1,date:new Date().toISOString(),data:{}};
 Object.keys(localStorage).filter(k=>k.startsWith('sanfour_')).forEach(k=>d.data[k]=localStorage.getItem(k));
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));
 a.download='sanfour-backup-'+new Date().toISOString().slice(0,10)+'.json';
 document.body.appendChild(a);a.click();a.remove();
}
 /* ---------- Fix: require last word + honest headline ---------- */
const _sr=stopReading;
window.stopReading=function(t){
 const was=phase;_sr(t);if(was!=='reading')return;
 lastIdx=-1;mode='last';$('modeBtn').classList.add('sel');
 $('rnote').textContent='① اضغطي على آخر كلمة وصل إليها الطالب. ② ثم اضغطي على كل كلمة أخطأ فيها (تصبح برتقالية). ③ ثم اضغطي «احسب النتيجة».';
 renderWords();
};
const _cr=calcResult;
window.calcResult=function(){
 if(lastIdx<0){alert('اضغطي أولًا على آخر كلمة قرأها الطالب.');return;}
 _cr();
 const ok=R.wcpm>=TARGETS[P.grade][P.level-1]&&R.acc>=95;
 document.querySelector('#result h2').textContent=R.acc<90?'أحسنت المحاولة! واصل التدريب 🌱':ok?'قراءة رائعة! 🌟':'عمل جيد! استمر 💪';
 if(R.secs<15)$('rstats').insertAdjacentHTML('beforeend','<p class="note" style="grid-column:1/-1;color:var(--c);font-weight:700">⚠️ القراءة كانت أقل من ١٥ ثانية، لذلك النتيجة تقديرية وغير دقيقة.</p>');
};
 /* ---------- Free reading mode (no time limit) ---------- */
let timed=localStorage.getItem('sanfour_timed')==='1';
$('startBtn').insertAdjacentHTML('afterend','<button id="modeT" class="alt small" onclick="toggleTimed()"></button>');
function modeLabel(){$('modeT').textContent=timed?'⏱ دقيقة واحدة (اضغطي للتغيير)':'♾️ بدون حد زمني (اضغطي للتغيير)';$('timer').textContent=timed?ar(60):ar(0);}
function toggleTimed(){timed=!timed;localStorage.setItem('sanfour_timed',timed?'1':'0');modeLabel();}
const _op2=openPassage;
window.openPassage=function(id){_op2(id);$('modeT').classList.remove('hidden');modeLabel();};
const _st=startReading;
window.startReading=async function(){
 $('modeT').classList.add('hidden');
 await _st();
 if(!timed){
  clearInterval(tick);$('timer').textContent=ar(0);
  tick=setInterval(()=>{const s=Math.floor((Date.now()-t0)/1000);$('timer').textContent=ar(s);if(s>=600)stopReading(true);},250);
  $('rnote').textContent=(rec?'🔴 جارٍ التسجيل… ':'')+'لا يوجد حد زمني. اضغطي «انتهى» عندما يتوقف الطالب عن القراءة.';
 }
};
const _sr2=stopReading;
window.stopReading=function(t){
 const was=phase;_sr2(t);if(was!=='reading')return;
 if(!timed&&t===true)elapsed=600;
 if(t!==true&&confirm('هل قرأ الطالب النص كاملًا حتى آخر كلمة؟')){
  lastIdx=words.length-1;mode='err';$('modeBtn').classList.remove('sel');
  $('rnote').textContent='اضغطي على كل كلمة أخطأ فيها الطالب (تصبح برتقالية)، ثم اضغطي «احسب النتيجة».';
  renderWords();
 }
};
 migrate();renderHome();
if(sessionStorage.getItem('sanfour_user')&&getUsers().length){enterApp();if(unlocked())$('lockBtn').classList.remove('hidden');}else gateMode();
</script>
